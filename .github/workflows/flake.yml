# 윈도우에서 `ui` 자체점검이 **가끔** 죽는다 — 열 번 돌려 몇 번인지, 자국이 늘 같은지 잰다.
#
# ★ 손으로만 돌린다. 흔들리는 것을 「다시 돌리면 되겠지」로 넘기지 않으려고 둔 판이고,
#   자리를 잡으면 **지운다.**
name: 흔들림 재기

on:
  workflow_dispatch:

# ★ 몇 번 돌릴지는 여기 박는다. 입력 이름을 한글로 뒀더니 깃허브가
#   「Unexpected symbol: '몇번'」 으로 판을 아예 안 읽었다 — 표현식에 쓰는 이름은
#   영문이어야 한다(PyQt·zsh·bash 와 같은 자리다. 오늘만 다섯 번째다).
env:
  TIMES: '30'

jobs:
  flake:
    name: ui 검사 흔들림
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pc/requirements-ci.txt
      - run: python -m pip install -U pip && python -m pip install -r requirements-ci.txt

      # ★ 먼저 **가장 작은 조각**으로 재 본다 — 딴 실이 쏜 신호를 주 실이 꺼내는 자리.
      #   맥에서는 300번을 돌려도 안 죽었다. 여기서 죽으면 짐작이 맞은 것이다.
      - name: 딴 실 신호만 두들겨 본다
        shell: pwsh
        continue-on-error: true
        run: |
          for ($i = 1; $i -le 3; $i++) {
            & python -X faulthandler tools\신호흔들림.py 300 2>&1 | Select-Object -Last 8
            Write-Host "  ($i) 끝난 코드 $LASTEXITCODE"
          }

      - name: 여러 번 돌려 본다
        shell: pwsh
        run: |
          $몇 = [int]$env:TIMES
          $죽음 = 0
          for ($i = 1; $i -le $몇; $i++) {
            $env:PYTHONIOENCODING = 'utf-8'
            $난것 = & python -X faulthandler ui.py --check 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {
              $죽음++
              Write-Host "=== $i 번째: 끝난 코드 $LASTEXITCODE"
              ($난것 -split "`n" | Where-Object { $_ -match 'fatal|File "|Current thread|Error' }) |
                Select-Object -Last 12 | ForEach-Object { Write-Host "    $_" }
            } else {
              Write-Host "$i 번째: 통과"
            }
          }
          Write-Host "== $몇 번 중 $죽음 번 죽었다"
          if ($죽음 -gt 0) { exit 1 }
